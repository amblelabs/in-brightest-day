name: Automated Builds

on:
  workflow_dispatch:
  push:
      paths:
        - src/**
        - build.gradle
        - gradle.properties
        - settings.gradle
        - gradle/**
        - gradlew
        - gradlew.bat
        - versioning.gradle
        - .github/workflows/publish-devbuilds.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Restore DataGen cache
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: src/main/generated
        key: datagen-${{ github.run_id }}
        restore-keys:
          datagen-

    - name: Run DataGen
      run: ./gradlew runDatagen

    - name: Save DataGen cache
      id: cache-save
      uses: actions/cache/save@v6
      with:
        path: src/main/generated
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}
    
    - name: Build
      run: ./gradlew build

    - name: Publish artifacts
      uses: drtheodor/discord-webhook-upload-action@v0.4
      with:
        url: ${{ secrets.DEV_BUILDS }}
        username: mogo doesnt socialize
        avatar: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDmP1EjlVDygiFMy8_Nxg9Q7M7eZfLKEXyKCRtosnS_J3lTLJMT6lpPCA&s=10'
        
        message: |
          <:new1:1253371736510959636><:new2:1253371805734015006> New **In Brightest Day** dev build [**`#${{ github.run_number }}`**](<https://github.com/amblelabs/in-brightest-day/actions/runs/${{ github.run_id }}>):
          ${commits}
          
        file: |
          build/libs/*.jar
          !build/libs/*-sources.jar
    - name: Send failure notice
      if: failure()
      uses: drtheodor/discord-webhook-upload-action@v0.4
      with:
        url: ${{ secrets.DEV_BUILDS }}
        username: green
        avatar: 'https://i.imgur.com/uiFqrQh.png'
        
        message: |
          <:al_error:1513885241339678852> New **In Brightest Day** dev build [**`#${{ github.run_number }}`**](<https://github.com/amblelabs/in-brightest-day/actions/runs/${{ github.run_id }}>) **failed** to build! <a:al_explosion:1467652202356150272>
